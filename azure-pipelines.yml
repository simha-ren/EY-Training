# Azure DevOps CI/CD for ProposalForge Pro.
# Requires a service connection (azureSubscription) and an ACR service connection.
# Pipeline variables: ACR_NAME, AZURE_WEBAPP_NAME, AZURE_SUBSCRIPTION, RESOURCE_GROUP.

trigger:
  branches: { include: [ main ] }
pr:
  branches: { include: [ main ] }

variables:
  imageName: proposalforge
  vmImage: ubuntu-latest

stages:
  # 1) Unit + integration tests
  - stage: Test
    jobs:
      - job: pytest
        pool: { vmImage: $(vmImage) }
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.12' }
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt pytest coverage
            displayName: Install
          - script: python -m pytest tests -q
            displayName: Unit + integration tests
          - script: |
              coverage run --source=core -m pytest tests -q
              coverage xml
            displayName: Coverage
          - task: PublishCodeCoverageResults@2
            inputs: { summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml' }

  # 2) Build image in ACR + deploy to App Service
  - stage: BuildDeploy
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: build_deploy
        pool: { vmImage: $(vmImage) }
        steps:
          - task: AzureCLI@2
            displayName: Build & push image (ACR)
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr build --registry $(ACR_NAME) \
                  --image $(imageName):$(Build.BuildId) \
                  --image $(imageName):latest \
                  --file Dockerfile.azure .
          - task: AzureWebAppContainer@1
            displayName: Deploy to Web App for Containers
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              appName: $(AZURE_WEBAPP_NAME)
              containers: $(ACR_NAME).azurecr.io/$(imageName):$(Build.BuildId)

  # 3) Post-deploy load test (fails the pipeline on errors)
  - stage: LoadTest
    dependsOn: BuildDeploy
    condition: succeeded()
    jobs:
      - job: locust
        pool: { vmImage: $(vmImage) }
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.12' }
          - script: pip install locust
            displayName: Install Locust
          - script: |
              locust -f tests/load/locustfile.py \
                --host https://$(AZURE_WEBAPP_NAME).azurewebsites.net \
                --headless -u 20 -r 5 -t 60s --only-summary --exit-code-on-error 1
            displayName: Smoke load test
