[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety_guardrails_pkg"
version = "0.0.1"
description = "CreditLens safety guardrails and pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "FinanceGuard", email = "devops@financeguard.example" } ]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/simha-ren/EY-Training/tree/main/DAY14/Safety_guradrails"
