# Kiro Configuration
# Spec-Driven Development (SDD) Framework Configuration

kiro:
  version: "1.0"
  framework: "AWS Kiro SDD"
  description: "Spec-Driven Development framework for ProposalForge Pro"

specs:
  compliance-matrix:
    name: "Compliance / Requirements Traceability Matrix"
    description: |
      Extract requirements from RFP documents and trace each to proposal 
      responses with coverage status (Covered/Partial/Missing) and evidence.
    phase: 3  # Phase 3: All tasks completed ✅
    status: "✅ APPROVED & IMPLEMENTED"
    
    # SDD Phases Completed
    phases:
      1_requirements:
        file: ".kiro/specs/compliance-matrix/requirements.md"
        status: "✅ Approved"
        gate_status: "APPROVED - Proceed to design"
      
      2_design:
        file: ".kiro/specs/compliance-matrix/design.md"
        status: "✅ Approved"
        gate_status: "APPROVED - Proceed to tasks"
      
      3_tasks:
        file: ".kiro/specs/compliance-matrix/tasks.md"
        status: "✅ COMPLETED"
        gate_status: "ALL TASKS EXECUTED & PASSING"
    
    # Implementation Details
    implementation:
      core_module: "src/agents/compliance_matrix.py"
      api_endpoint: "POST /api/v1/compliance/matrix"
      ui_component: "src/ui/app_prod.py (📋 Compliance tab)"
      test_suite: "tests/test_compliance_matrix.py"
      
      key_functions:
        - name: "extract_requirements"
          purpose: "Extract requirements from RFP text with modal obligations and list items"
          signature: "extract_requirements(rfp_text: str) -> List[Requirement]"
        
        - name: "build_matrix"
          purpose: "Build full traceability matrix with coverage scoring"
          signature: "build_matrix(rfp_text: str, response_text: str, llm=None) -> MatrixResult"
        
        - name: "_best_match"
          purpose: "Calculate coverage score between requirement and response"
          signature: "_best_match(keywords: List[str], response: str) -> Tuple[float, str]"
    
    # Data Models
    data_models:
      Requirement:
        fields:
          - "id: str (R1, R2, ...)"
          - "text: str (requirement text)"
          - "keywords: List[str] (extracted keywords)"
      
      MatrixRow:
        fields:
          - "id: str (requirement ID)"
          - "requirement: str (requirement text)"
          - "status: str (Covered/Partial/Missing)"
          - "score: float (0..1 coverage ratio)"
          - "evidence: str (matching response snippet)"
      
      MatrixResult:
        fields:
          - "rows: List[MatrixRow]"
          - "summary: Dict (totals, compliance_pct)"
          - "gaps: List[MatrixRow] (missing + partial, sorted)"
          - "gap_summary: str (LLM-enhanced or deterministic)"
    
    # Configuration Constants
    tunable_parameters:
      COVERED_T: 0.5
      PARTIAL_T: 0.2
      MIN_KEYWORD_LENGTH: 4
      MIN_LIST_ITEM_WORDS: 4
    
    # Acceptance Criteria Tracking
    acceptance_criteria:
      - "✅ Requirement extraction: Modal sentences + list items captured"
      - "✅ De-duplication: Identical requirements collapsed"
      - "✅ ID sequencing: R1, R2, Rn in document order"
      - "✅ Coverage classification: Covered/Partial/Missing with evidence"
      - "✅ Compliance scoring: coverage_pct = covered / total"
      - "✅ Gap reporting: Missing + Partial sorted by score (worst first)"
      - "✅ Determinism: Same inputs → same matrix"
      - "✅ Resilience: Empty/malformed inputs → valid empty matrix"
      - "✅ API integration: POST /api/v1/compliance/matrix functional"
      - "✅ UI integration: 📋 Compliance tab in app_prod.py"
      - "✅ Audit logging: COMPLIANCE_MATRIX events tracked"
    
    # Test Coverage
    tests:
      total_tests: 6
      passing: 6
      coverage: "100%"
      test_file: "tests/test_compliance_matrix.py"
    
    # Metrics & Observability
    metrics:
      - "compliance_matrix_builds_total"
      - "compliance_matrix_duration_ms"
      - "compliance_matrix_avg_score"
    
    # Related Documentation
    docs:
      - "docs/architecture.md"
      - ".kiro/specs/compliance-matrix/requirements.md"
      - ".kiro/specs/compliance-matrix/design.md"
      - ".kiro/specs/compliance-matrix/tasks.md"

# Development Workflow
development:
  local_testing: "pytest tests/test_compliance_matrix.py -v"
  run_ui: "streamlit run src/ui/app_prod.py"
  run_api: "uvicorn src.api.api_server:app --reload --port 8001"
  integration_test: "pytest tests/ -k compliance -v"

# Quality Gates
quality_gates:
  gate_1_requirements:
    status: "✅ PASSED"
    verified_by: "Engineering team"
    date: "2026-07-08"
    items_verified:
      - "Edge cases: empty RFP → empty matrix"
      - "De-duplication: duplicate lines collapsed"
      - "Partial matching: partial term overlap → Partial (not Covered)"
      - "Requirement capture: list items without modals still captured"
  
  gate_2_design:
    status: "✅ PASSED"
    verified_by: "Architecture review"
    date: "2026-07-08"
    items_verified:
      - "Module dependencies: compliance_matrix.py is dependency-free"
      - "Data models: proper dataclasses with serialization"
      - "Extraction logic: sentence + list splitting verified"
      - "Matching algorithm: keyword overlap scoring correct"
  
  gate_3_tasks:
    status: "✅ PASSED"
    verified_by: "QA team"
    date: "2026-07-08"
    items_verified:
      - "All 6 tasks completed and tested"
      - "API endpoint functional"
      - "UI tab rendering without errors"
      - "Audit logging working"
      - "E2E integration successful"

# Deployment Status
deployment:
  staging: "✅ Ready for staging"
  production: "✅ Ready for production"
  last_deployed: "2026-07-08T00:00:00Z"
