name: CI/CD - Azure

on:
  push:
    branches: [ main ]
  pull_request:

env:
  IMAGE_NAME: proposalforge

jobs:
  # 1) Unit + integration tests (must pass before build)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage
      - name: Unit + integration tests
        run: python -m pytest tests -q
      - name: Coverage
        run: |
          coverage run --source=src -m pytest tests -q
          coverage report

  # 1b) End-to-end evaluation against a real document (offline; gates deploy)
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: E2E real-doc evaluation (RAGAS-style proxies + groundedness)
        run: python eval/eval_realdoc.py
      - name: Golden-set evaluation (routing / retrieval / recall / citations)
        run: python -m eval.evaluate

  # 2) Build image, push to ACR, deploy to Azure Web App for Containers
  build-deploy:
    needs: [test, eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build & push image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --file infra/Dockerfile.azure .
      - name: Deploy to Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 3) Post-deploy load test with thresholds (fails the pipeline if breached)
  load-test:
    needs: build-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Locust
        run: pip install locust
      - name: Load test with per-endpoint p95 thresholds
        # locustfile.py enforces health<50ms, retrieve<50ms, end-to-end p95<5s
        # and exits non-zero if any budget or error rate is breached.
        run: |
          locust -f tests/load/locustfile.py \
            --host https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net \
            --headless -u 20 -r 5 -t 60s --only-summary \
            --exit-code-on-error 1

  # Optional: run the same test on Azure Load Testing (cloud scale) instead of
  # the in-CI Locust above. Requires the ALT resource (provisioned by Bicep) and
  # an AZURE_LOAD_TEST_RESOURCE secret. Uncomment to enable.
