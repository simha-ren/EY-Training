# Production stack — all free / open-source, deployable end to end.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Brings up: app (Streamlit+FastAPI), Qdrant, Ollama, Prometheus, Grafana, Nginx.
# Set secrets in .env (see .env.production.example). Add TLS certs under deploy/certs.

services:
  proposalforge-pro:
    environment:
      - REQUIRE_AUTH=true
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?set a strong admin password}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/pf_metrics
      # Observability (optional): LangSmith or Langfuse
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-proposalforge}
    # App is reached through nginx; bind app ports to localhost only.
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"

  nginx:
    image: nginx:alpine
    container_name: proposalforge-nginx
    depends_on:
      - proposalforge-pro
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - proposalforge-network
    restart: unless-stopped
