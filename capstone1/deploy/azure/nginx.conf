# nginx multiplexes the Streamlit UI and the FastAPI API behind one port.
# Runs as a non-root user, so pid/temp paths live under writable dirs.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events { worker_connections 1024; }

http {
    access_log /tmp/nginx-access.log;
    client_max_body_size 60m;          # allow document uploads (MAX_FILE_SIZE_MB)

    # nginx (non-root) needs writable temp paths.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    upstream streamlit { server 127.0.0.1:8501; }
    upstream api       { server 127.0.0.1:8001; }

    # Common proxy headers reused by the API locations.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080;
        server_name _;

        # ---- Azure warmup/health probes: instant 200, never touch Streamlit ----
        location = /robots933456.txt { return 200 "ok"; }
        location = /healthz          { return 200 "ok"; }


        # ---- API surface -> FastAPI --------------------------------------
        location /api      { proxy_pass http://api; }
        location /health   { proxy_pass http://api; }
        location /metrics  { proxy_pass http://api; }
        location /docs     { proxy_pass http://api; }
        location /openapi.json { proxy_pass http://api; }

        # ---- Streamlit websocket (must come before the catch-all) --------
        location /_stcore/stream {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # ---- Everything else -> Streamlit UI -----------------------------
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
