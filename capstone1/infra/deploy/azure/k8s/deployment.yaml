# AKS alternative to App Service. Apply after pushing the image to ACR:
#   kubectl apply -f deploy/azure/k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proposalforge
  labels: { app: proposalforge }
spec:
  replicas: 2
  selector: { matchLabels: { app: proposalforge } }
  template:
    metadata:
      labels: { app: proposalforge }
    spec:
      containers:
        - name: app
          image: REPLACE_ACR.azurecr.io/proposalforge:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: proposalforge-config }
            - secretRef: { name: proposalforge-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "3Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: proposalforge
spec:
  selector: { app: proposalforge }
  ports: [{ port: 80, targetPort: 8080 }]
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proposalforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: proposalforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: proposalforge, port: { number: 80 } } }
