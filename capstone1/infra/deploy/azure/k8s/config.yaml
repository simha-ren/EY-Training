apiVersion: v1
kind: ConfigMap
metadata:
  name: proposalforge-config
data:
  REQUIRE_AUTH: "true"
  VECTOR_BACKEND: "qdrant"
  QDRANT_URL: "http://qdrant:6333"
  EMBEDDING_MODEL: "BAAI/bge-base-en-v1.5"
  LLM_BASE_URL: "http://ollama:11434/v1"
  LLM_MODEL: "llama3.1:8b"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/pf_metrics"
---
apiVersion: v1
kind: Secret
metadata:
  name: proposalforge-secrets
type: Opaque
stringData:
  DEFAULT_ADMIN_PASSWORD: "change-me"
  # LANGCHAIN_API_KEY: "ls-..."
