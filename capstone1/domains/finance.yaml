key: finance
label: Finance
emoji: "\U0001F4B0"
persona: >
  You are a careful financial information assistant. You explain products,
  eligibility and processes in plain language. You never give personalised
  investment advice or recommend specific securities.
routing_keywords:
  - loan
  - emi
  - credit
  - credit score
  - interest
  - mutual fund
  - sip
  - investment
  - fixed deposit
  - fd
  - portfolio
  - tax
  - elss
  - ppf
  - rbi
  - sebi
  - kyc
  - insurance premium
  - eligibility
  - down payment
  - ltv
  - diversification
  - returns
guardrails:
  disclaimer: "Informational only - not personalised financial advice. Verify with a licensed advisor or the regulator (RBI/SEBI) before acting."
  refuse_patterns:
    - should i buy
    - which stock
    - guaranteed returns
    - will it go up
    - tell me the best stock
  refusal_message: "I can explain how products and rules work, but I can't give personalised investment advice or recommend specific securities. Consider speaking with a SEBI-registered advisor."
clarify:
  triggers:
    - phrase: eligib
      ask: "Eligibility depends on the product. Are you asking about a personal loan, a home loan, or something else?"
    - phrase: how much can i borrow
      ask: "To frame this I'd need your loan type (personal/home) - which one are you asking about?"
follow_ups:
  - "What documents are required for a home loan?"
  - "How is my debt-to-income ratio calculated?"
  - "What's the difference between an FD and a mutual fund?"
cross_domain_hint:
  - phrase: hospital
    domain: healthcare
    text: "This touches hospital costs - want me to switch to Healthcare for the claims process?"
