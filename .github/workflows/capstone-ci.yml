name: Capstone CI

# Runs only when the capstone folder changes, so it won't fire for other days.
on:
  push:
    paths: ['capstone/**', '.github/workflows/capstone-ci.yml']
  pull_request:
    paths: ['capstone/**', '.github/workflows/capstone-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone     # all run-steps execute inside capstone/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage
      - name: Run tests
        run: python -m pytest tests -q
      - name: Coverage
        run: |
          coverage run --source=src -m pytest tests -q
          coverage report
