  #     - uses: azure/login@v2
  #       with: { creds: ${{ secrets.AZURE_CREDENTIALS }} }
  #     - uses: azure/load-testing@v1
  #       with:
  #         loadTestConfigFile: tests/load/loadtest.yaml
  #         loadTestResource: ${{ secrets.AZURE_LOAD_TEST_RESOURCE }}
  #         resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
