name: Capstone CI/CD - Azure

# Runs only when the capstone folder changes.
on:
  push:
    branches: [ main ]
    paths: ['capstone/**', '.github/workflows/capstone-azure.yml']
  pull_request:
    paths: ['capstone/**', '.github/workflows/capstone-azure.yml']

env:
  IMAGE_NAME: proposalforge

jobs:
  # 1) Unit + integration tests (must pass before build)
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage
      - name: Unit + integration tests
        run: python -m pytest tests -q
      - name: Coverage
        run: |
          coverage run --source=src -m pytest tests -q
          coverage report

  # 1b) End-to-end evaluation against a real document (offline; gates deploy)
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: E2E real-doc evaluation (groundedness gate)
        run: python eval/eval_realdoc.py
      - name: Golden-set evaluation (routing / retrieval / recall / citations)
        run: python -m eval.evaluate

  # 2) Build image, push to ACR, deploy to Azure Web App for Containers
  build-deploy:
    needs: [test, eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      # No service principal: push with ACR admin creds, deploy with publish profile.
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build & push image
        run: |
          IMG=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          docker build -f infra/Dockerfile.azure -t $IMG:${{ github.sha }} -t $IMG:latest .
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
      - name: Deploy to Web App for Containers (publish profile)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 3) Post-deploy load test with per-endpoint p95 thresholds (fails if breached)
  load-test:
    needs: build-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Locust
        run: pip install locust
      - name: Load test with per-endpoint p95 thresholds
        # locustfile.py enforces health<50ms, retrieve<50ms, end-to-end p95<5s.
        run: |
          locust -f tests/load/locustfile.py \
            --host https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net \
            --headless -u 20 -r 5 -t 60s --only-summary \
            --exit-code-on-error 1
