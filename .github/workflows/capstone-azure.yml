name:  Capstone-Azure

on:
  push:
    branches: [ main ]
  pull_request:

env:
  IMAGE_NAME: proposalforge

jobs:
  # 1) Unit + integration tests (must pass before build)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage
      - name: Unit + integration tests
        run: python -m pytest tests -q
      - name: Coverage
        run: |
          coverage run --source=src -m pytest tests -q
          coverage report

  # 1b) End-to-end evaluation against a real document (offline; gates deploy)
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: E2E real-doc evaluation (RAGAS-style proxies + groundedness)
        run: python eval/eval_realdoc.py
      - name: Golden-set evaluation (routing / retrieval / recall / citations)
        run: python -m eval.evaluate

  # 2) Build image, push to ACR, deploy to Azure Web App for Containers
  build-deploy:
    needs: [test, eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      # No service principal: push with ACR admin creds, deploy with publish profile.
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build & push image
        run: |
          IMG=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          docker build -f infra/Dockerfile.azure -t $IMG:${{ github.sha }} -t $IMG:latest .
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
      - name: Deploy to Web App for Containers (publish profile)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 3) Post-deploy load test with thresholds (fails the pipeline if breached)
  load-test:
    needs: build-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Locust
        run: pip install locust
      - name: Load test with per-endpoint p95 thresholds
        # locustfile.py enforces realistic p95 budgets (health<800ms, retrieve<1200ms,
        # end-to-end<8s over public HTTPS) and a <1% error tolerance, exiting
        # non-zero only if a budget or the error rate is breached. Override via env.
        env:
          P95_HEALTH_MS: "800"
          P95_RETRIEVE_MS: "1200"
          P95_E2E_MS: "8000"
          LOAD_MAX_ERROR_RATE: "0.02"
        run: |
          # brief warm-up so the first (cold-start) requests don't skew p95
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 \
            "https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" || true
          locust -f tests/load/locustfile.py \
            --host https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net \
            --headless -u 20 -r 5 -t 60s --only-summary

  # Optional: run the same test on Azure Load Testing (cloud scale) instead of
  # the in-CI Locust above. Requires the ALT resource (provisioned by Bicep) and
  # an AZURE_LOAD_TEST_RESOURCE secret. Uncomment to enable.
