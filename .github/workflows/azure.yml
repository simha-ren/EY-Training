name: CI/CD - Azure (build & push to ACR)

# Works with ONLY "Contributor" access — no role assignment, no basic auth.
# It tests, builds, and pushes the image to your Azure Container Registry
# using the ACR admin credentials. The web app picks up the new image on
# its next Restart (it pulls using the DOCKER_REGISTRY_SERVER_* settings you
# configured on the app). No service principal or publish profile required.

on:
  push:
    branches: [ main ]
  pull_request:

env:
  IMAGE_NAME: proposalforge
  REQUIRE_AUTH: "false"
  VECTOR_BACKEND: "tfidf"
  LANGCHAIN_TRACING_V2: "false"

jobs:
  # 1) Tests
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: capstone/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage
      - name: Unit + integration tests
        run: python -m pytest tests -q
      - name: Coverage
        run: |
          coverage run --source=core -m pytest tests -q
          coverage report

  # 2) Build the image and push it to ACR (self-serve, admin creds)
  build-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets and Dockerfile are present
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          m=0
          [ -z "$ACR_LOGIN_SERVER" ] && { echo "::error::ACR_LOGIN_SERVER missing"; m=1; } || echo "ACR_LOGIN_SERVER present"
          [ -z "$ACR_USERNAME" ] && { echo "::error::ACR_USERNAME missing"; m=1; } || echo "ACR_USERNAME present"
          [ -z "$ACR_PASSWORD" ] && { echo "::error::ACR_PASSWORD missing"; m=1; } || echo "ACR_PASSWORD present (len ${#ACR_PASSWORD})"
          if [ ! -s Dockerfile.azure ]; then
            echo "::error::capstone/Dockerfile.azure is missing or empty in the repo — commit it."; m=1
          else
            echo "Dockerfile.azure present ($(wc -c < Dockerfile.azure) bytes)"
          fi
          exit $m

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          BASE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          docker build -f Dockerfile.azure \
            -t "$BASE:${{ github.sha }}" \
            -t "$BASE:latest" \
            .
          docker push "$BASE:${{ github.sha }}"
          docker push "$BASE:latest"

      - name: Done
        run: |
          echo "Image pushed to ACR as :latest and :${{ github.sha }}"
          echo "To go live: open the Web App in the portal and click 'Restart'."
          echo "It will pull the new :latest image using its registry settings."
