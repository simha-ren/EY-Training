name: CI/CD - Azure

on:
  push:
    branches: [ main ]
  pull_request:

env:
  IMAGE_NAME: proposalforge
  REQUIRE_AUTH: "false"
  VECTOR_BACKEND: "tfidf"
  LANGCHAIN_TRACING_V2: "false"

jobs:
  # 1) Unit + integration tests (must pass before build)
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: capstone/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage
      - name: Unit + integration tests
        run: python -m pytest tests -q
      - name: Coverage
        run: |
          coverage run --source=core -m pytest tests -q
          coverage report

  # 2) Build image, push to ACR, deploy to Azure Web App for Containers
  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build & push image to ACR
        # Build context is the capstone/ folder; Dockerfile lives inside it.
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --file capstone/Dockerfile.azure \
            capstone
      - name: Deploy to Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 3) Post-deploy load test with thresholds (fails the pipeline if breached)
  load-test:
    needs: build-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Locust
        run: pip install locust
      - name: Wait for the site to be healthy
        run: |
          URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for i in $(seq 1 40); do
            curl -fsS "$URL" && break || sleep 5
          done
      - name: Smoke load test (fails on error rate)
        run: |
          locust -f tests/load/locustfile.py \
            --host https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net \
            --headless -u 20 -r 5 -t 60s --only-summary \
            --exit-code-on-error 1
