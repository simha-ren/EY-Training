# FinSight AI — LLM Eval Pipeline (Lab 3)
# Triggers on every PR to main modifying Day13/finsight_llm_eva files; also runs nightly.

name: LLM Eval Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Day13/finsight_llm_eva/src/**'
      - 'Day13/finsight_llm_eva/tests/**'
      - '.github/workflows/llm-eval.yml'
  push:
    branches: [ main ]
    paths:
      - 'Day13/finsight_llm_eva/src/**'
      - 'Day13/finsight_llm_eva/tests/**'
      - '.github/workflows/llm-eval.yml'
  schedule:
    - cron: '0 2 * * *'   # Nightly full eval at 02:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI
    inputs:
      eval_mode:
        description: 'Eval mode (smoke = 5 easy cases; full = all 20)'
        required: false
        default: 'smoke'
        type: choice
        options: [ smoke, full ]

jobs:

  # ─── Job 1: Unit tests (fast, no API calls) ────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r Day13/finsight_llm_eva/requirements.txt -q

      - name: Run unit tests
        run: pytest Day13/finsight_llm_eva/tests/ -v --tb=short -m "not integration"

  # ─── Job 2: LLM Eval Quality Gate (requires GROQ_API_KEY) ──────
  llm-eval:
    name: LLM Eval Quality Gate
    runs-on: ubuntu-latest
    needs: unit-tests       # Only run eval if unit tests pass
    permissions:
      contents: read
      pull-requests: write  # Needed to post PR comment

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EVAL_MODE: ${{ github.event.inputs.eval_mode || (github.event_name == 'schedule' && 'full') || 'smoke' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r Day13/finsight_llm_eva/requirements.txt -q

      - name: Run FinSight eval harness
        id: run_eval
        run: |
          cd Day13/finsight_llm_eva
          python src/run_ci_eval.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload eval artefacts
        if: always()    # Upload even if gate fails
        uses: actions/upload-artifact@v4
        with:
          name: finsight-eval-results-${{ github.run_number }}
          path: Day13/finsight_llm_eva/results/
          retention-days: 30

      - name: Post results to PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let gate;
            try {
              gate = JSON.parse(fs.readFileSync('Day13/finsight_llm_eva/results/gate_outcome.json', 'utf8'));
            } catch (e) {
              console.log("Could not read gate_outcome.json:", e);
              return;
            }
            const icon   = gate.passed ? '✅' : '❌';
            const status = gate.passed ? 'PASSED' : 'FAILED';
            const body = [
              '## ' + icon + ' FinSight LLM Eval — Quality Gate ' + status,
              '',
              '**' + gate.reason + '**',
              '',
              gate.best_model
                ? '🏆 Recommended model: `' + gate.best_model + '`'
                : '⚠️ No model met all production constraints.',
              '',
              '> Full results uploaded as [Actions artefacts](' +
                'https://github.com/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId + ').',
            ].join('\n');
            await github.rest.issues.createComment({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ─── Slack notification (gate result) ───────────────────────
      # Posts to the channel wired to SLACK_WEBHOOK_URL. Fires on both
      # pass and fail; flip `if:` to `failure()` for failures-only.
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi

          cd Day13/finsight_llm_eva
          if [ -f results/gate_outcome.json ]; then
            PASSED=$(jq -r '.passed' results/gate_outcome.json)
            REASON=$(jq -r '.reason' results/gate_outcome.json)
            BEST=$(jq -r '.best_model // empty' results/gate_outcome.json)
          else
            PASSED=false
            REASON="Eval harness produced no gate outcome (it likely crashed before writing results)."
            BEST=""
          fi

          if [ "$PASSED" = "true" ]; then ICON="✅"; STATUS="PASSED"; else ICON="❌"; STATUS="FAILED"; fi
          if [ -n "$BEST" ]; then BEST_TXT="$BEST"; else BEST_TXT="none met all constraints"; fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg header  "$ICON FinSight LLM Eval — Quality Gate $STATUS" \
            --arg repo    "$GITHUB_REPOSITORY" \
            --arg mode    "${EVAL_MODE:-smoke}" \
            --arg best    "$BEST_TXT" \
            --arg trigger "$GITHUB_EVENT_NAME" \
            --arg reason  "$REASON" \
            --arg run_url "$RUN_URL" \
            '{
              blocks: [
                { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*Repo:*\n" + $repo) },
                    { type: "mrkdwn", text: ("*Mode:*\n" + $mode) },
                    { type: "mrkdwn", text: ("*Best model:*\n" + $best) },
                    { type: "mrkdwn", text: ("*Trigger:*\n" + $trigger) }
                ] },
                { type: "section", text: { type: "mrkdwn", text: $reason } },
                { type: "context", elements: [
                    { type: "mrkdwn", text: ("<" + $run_url + "|View full run & artefacts>") }
                ] }
              ]
            }')

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Fail job if quality gate failed
        if: steps.run_eval.outputs.exit_code != '0'
        run: |
          echo "Quality gate failed — see results/gate_outcome.json for details."
          exit 1

  # ─── Job 3: Nightly full eval (schedule only) ──────────────────
  nightly-full-eval:
    name: Nightly Full Eval (20 cases × 4 models)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: unit-tests

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EVAL_MODE: full

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r Day13/finsight_llm_eva/requirements.txt -q

      - name: Run full eval (all 20 cases × 4 Groq models)
        run: |
          cd Day13/finsight_llm_eva
          EVAL_MODE=full python src/run_ci_eval.py

      - name: Upload nightly artefacts
        uses: actions/upload-artifact@v4
        with:
          name: finsight-nightly-${{ github.run_number }}
          path: Day13/finsight_llm_eva/results/
          retention-days: 90

      # ─── Slack notification (nightly result) ────────────────────
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi

          cd Day13/finsight_llm_eva
          if [ -f results/gate_outcome.json ]; then
            PASSED=$(jq -r '.passed' results/gate_outcome.json)
            REASON=$(jq -r '.reason' results/gate_outcome.json)
            BEST=$(jq -r '.best_model // empty' results/gate_outcome.json)
          else
            PASSED=false
            REASON="Nightly eval produced no gate outcome (the harness likely crashed)."
            BEST=""
          fi

          if [ "$PASSED" = "true" ]; then ICON="✅"; STATUS="PASSED"; else ICON="❌"; STATUS="FAILED"; fi
          if [ -n "$BEST" ]; then BEST_TXT="$BEST"; else BEST_TXT="none met all constraints"; fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg header  "$ICON FinSight Nightly Full Eval — $STATUS" \
            --arg repo    "$GITHUB_REPOSITORY" \
            --arg best    "$BEST_TXT" \
            --arg reason  "$REASON" \
            --arg run_url "$RUN_URL" \
            '{
              blocks: [
                { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*Repo:*\n" + $repo) },
                    { type: "mrkdwn", text: "*Mode:*\nfull (20 cases × 4 models)" },
                    { type: "mrkdwn", text: ("*Best model:*\n" + $best) }
                ] },
                { type: "section", text: { type: "mrkdwn", text: $reason } },
                { type: "context", elements: [
                    { type: "mrkdwn", text: ("<" + $run_url + "|View full run & artefacts>") }
                ] }
              ]
            }')

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
