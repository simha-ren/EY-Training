name: 🚀 Simple Deployment with Slack Notifications

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/creditlens-guardrails

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Test & Build
  # ════════════════════════════════════════════════════════════════════════════
  
  test-and-build:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run tests
        id: tests
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee test_output.log
          echo "test_status=passed" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: 🔐 Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Docker image
        if: github.event_name == 'push'
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_output.log
          retention-days: 30

      - name: 📊 Set job outputs
        id: job_status
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "status=✅ PASSED" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # Deploy (Only on main branch)
  # ════════════════════════════════════════════════════════════════════════════
  
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☸️ Deploy to Kubernetes
        id: deploy
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # kubectl set image deployment/creditlens ...
          # kubectl rollout status deployment/creditlens
          echo "Deployment completed"
        continue-on-error: true

      - name: 🧪 Run smoke tests
        id: smoke_tests
        run: |
          echo "Running smoke tests..."
          # Add your smoke test commands here
          # curl http://localhost:8000/health
          echo "Smoke tests passed"
        continue-on-error: true

      - name: 📊 Set deploy status
        id: deploy_status
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ] && [ "${{ steps.smoke_tests.outcome }}" = "success" ]; then
            echo "deploy_result=✅ SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "deploy_result=❌ FAILED" >> $GITHUB_OUTPUT
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # Slack Notifications
  # ════════════════════════════════════════════════════════════════════════════
  
  notify-slack:
    name: 📢 Slack Notification
    runs-on: ubuntu-latest
    needs: [test-and-build, deploy]
    if: always()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Determine notification status
        id: determine_status
        run: |
          if [ "${{ needs.test-and-build.result }}" = "failure" ]; then
            echo "status=❌ Tests Failed"
            echo "color=danger"
          elif [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "status=❌ Deployment Failed"
            echo "color=danger"
          elif [ "${{ needs.test-and-build.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=✅ Deployment Successful"
            echo "color=good"
          else
            echo "status=⏭️ Tests Passed (No Deploy)"
            echo "color=warning"
          fi >> $GITHUB_OUTPUT

      - name: 📧 Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "CreditLens Safety Guardrails - ${{ steps.determine_status.outputs.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🛡️ CreditLens Safety Guardrails"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ steps.determine_status.outputs.status }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Event:*\n${{ github.event_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tests:*\n${{ needs.test-and-build.result }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Message:*\n${{ github.event.head_commit.message }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Commit"
                      },
                      "url": "${{ github.event.head_commit.url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ════════════════════════════════════════════════════════════════════════════
  # Alternative: simpler Slack notification (choose one)
  # ════════════════════════════════════════════════════════════════════════════
  
  notify-slack-simple:
    name: 📢 Slack (Simple Format)
    runs-on: ubuntu-latest
    needs: [test-and-build, deploy]
    if: always() && false  # Set to true if you prefer this format
    
    steps:
      - name: 📧 Send simple Slack message
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🛡️ CreditLens Safety Guardrails
            ├─ Event: ${{ github.event_name }}
            ├─ Branch: ${{ github.ref_name }}
            ├─ Author: ${{ github.actor }}
            ├─ Commit: ${{ github.sha }}
            ├─ Tests: ${{ needs.test-and-build.result }}
            └─ Deploy: ${{ needs.deploy.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        if: always()
