# Reverse proxy for ProposalForge Pro (TLS-terminating, WebSocket-aware).
# Streamlit needs WebSocket upgrade for /_stcore/stream.

upstream pf_streamlit { server proposalforge-pro:8000; }
upstream pf_api       { server proposalforge-pro:8001; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    # --- Redirect to HTTPS in production (uncomment once certs are mounted) ---
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;

    # FastAPI (webhook, pipeline, health)
    location /api/    { proxy_pass http://pf_api; include /etc/nginx/proxy_common.conf; }
    location /health  { proxy_pass http://pf_api/health; }

    # Prometheus metrics — restrict to internal networks in production
    location /metrics {
        allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
        proxy_pass http://pf_api/metrics;
    }

    # Streamlit app (default) + its WebSocket
    location / {
        proxy_pass http://pf_streamlit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/proxy_common.conf;
    }
}

